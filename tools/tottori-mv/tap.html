<title>金蓮 對拍器</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
:root{
  --ground:#F6F2E9; --surface:#FFFFFF; --edge:#E0D8C6;
  --ink:#1B2032; --muted:#6E7590; --accent:#A8741A; --accent-soft:#F0E2C4;
  --done:#3E7D5C; --shadow:0 1px 3px rgba(27,32,50,.10),0 8px 24px rgba(27,32,50,.06);
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1322; --surface:#192034; --edge:#2A3350;
    --ink:#E9EDF8; --muted:#8B95B3; --accent:#F2C170; --accent-soft:#2C2A20;
    --done:#7FD1A8; --shadow:0 1px 3px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1322; --surface:#192034; --edge:#2A3350;
  --ink:#E9EDF8; --muted:#8B95B3; --accent:#F2C170; --accent-soft:#2C2A20;
  --done:#7FD1A8; --shadow:0 1px 3px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:16px; line-height:1.7; padding-bottom:190px;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
header{padding:26px 0 14px}
h1{font-family:"Noto Serif TC",Georgia,serif;font-size:23px;font-weight:700;margin:0;letter-spacing:.10em}
.lede{color:var(--muted);font-size:14px;margin:8px 0 0;text-wrap:balance}
.steps{margin:16px 0 0;padding:14px 16px;background:var(--surface);border:1px solid var(--edge);
  border-radius:12px;box-shadow:var(--shadow)}
.steps ol{margin:0;padding-left:1.2em;font-size:14.5px}
.steps li{margin:5px 0}
.steps b{color:var(--accent)}

audio{width:100%;margin:16px 0 6px;display:block}

.now{margin:18px 0 8px;padding:20px 18px;border-radius:14px;background:var(--surface);
  border:1px solid var(--edge);box-shadow:var(--shadow);text-align:center;min-height:132px;
  display:flex;flex-direction:column;justify-content:center;gap:8px}
.now .sec{font-size:11px;letter-spacing:.24em;color:var(--accent);text-transform:uppercase}
.now .line{font-family:"Noto Serif TC",Georgia,serif;font-size:22px;font-weight:500;text-wrap:balance}
.now .next{font-size:14px;color:var(--muted);text-wrap:balance}
.count{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);letter-spacing:.05em}

ul.lines{list-style:none;padding:0;margin:18px 0 0}
ul.lines li{display:grid;grid-template-columns:2.2em 5.3em 1fr;gap:10px;align-items:baseline;
  padding:8px 10px;border-radius:9px;border:1px solid transparent;font-size:15px}
ul.lines li.cur{border-color:var(--accent);background:var(--accent-soft)}
ul.lines li.set .t{color:var(--done);font-weight:500}
ul.lines li .n{color:var(--muted);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
ul.lines li .t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13.5px;cursor:pointer}
ul.lines li .t:hover{color:var(--accent);text-decoration:underline}
ul.lines li .x{font-family:"Noto Serif TC",Georgia,serif}
li.divider{display:block !important;margin:18px 0 2px;padding:0 10px;font-size:11px;
  letter-spacing:.24em;color:var(--accent);border-top:1px solid var(--edge);padding-top:12px}

.dock{position:fixed;left:0;right:0;bottom:0;background:var(--ground);
  border-top:1px solid var(--edge);padding:12px 18px calc(14px + env(safe-area-inset-bottom))}
.dock .inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.tap{width:100%;height:78px;border:0;border-radius:14px;background:var(--accent);
  color:var(--ground);font-family:inherit;font-size:20px;font-weight:700;letter-spacing:.12em;
  cursor:pointer;box-shadow:var(--shadow)}
.tap:active{transform:translateY(1px)}
.tap:disabled{opacity:.45}
.row{display:flex;gap:8px}
.row button{flex:1;height:44px;border-radius:10px;border:1px solid var(--edge);
  background:var(--surface);color:var(--ink);font-family:inherit;font-size:14px;cursor:pointer}
.row button:hover{border-color:var(--accent)}
button:focus-visible,.t:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.out{margin-top:22px;padding:16px;border-radius:12px;background:var(--surface);
  border:1px solid var(--edge);box-shadow:var(--shadow)}
.out h2{font-size:13px;letter-spacing:.2em;margin:0 0 10px;color:var(--accent)}
textarea{width:100%;height:150px;background:var(--ground);color:var(--ink);
  border:1px solid var(--edge);border-radius:9px;padding:10px;font-family:ui-monospace,SFMono-Regular,monospace;
  font-size:12px;line-height:1.55}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
<header>
  <h1>金蓮 · 對拍器</h1>
  <p class="lede">先用上面的「選擇檔案」載入歌曲（或把 song.mp3 放在同一層），按播放。聽到每一句<b>唱出第一個字</b>的瞬間，按下方那顆大按鈕，就會把當下的秒數記下來。</p>
  <div class="steps">
    <ol>
      <li>按播放，讓它從頭跑</li>
      <li>聽到第 1 句「風吹裂了」唱出來 → 按 <b>打點</b></li>
      <li>之後每一句唱出來就按一次，共 <b>41 次</b></li>
      <li>按錯就按「退回上一句」，或點列表裡的秒數跳回去重來</li>
      <li>全部打完，把最下面框框裡的文字複製給我</li>
    </ol>
  </div>
  <input type="file" id="pick" accept="audio/*" style="margin:10px 0 4px;font-size:14px">
  <audio id="a" controls preload="metadata"></audio>
</header>

<div class="now">
  <div class="sec" id="sec"></div>
  <div class="line" id="cur"></div>
  <div class="next" id="nxt"></div>
  <div class="count"><span id="cnt">0</span> / 41 句已打點 ｜ 目前 <span id="clock">0.00</span> 秒</div>
</div>

<ul class="lines" id="list"></ul>

<div class="out">
  <h2>打點結果</h2>
  <textarea id="out" spellcheck="false" readonly></textarea>
  <div class="row" style="margin-top:10px">
    <button id="copy">複製結果</button>
    <button id="reset">全部清除</button>
  </div>
</div>
</div>

<div class="dock"><div class="inner">
  <button class="tap" id="tap">打　點</button>
  <div class="row">
    <button id="back">退回上一句</button>
    <button id="rew">倒退 5 秒</button>
    <button id="play">播放 / 暫停</button>
  </div>
</div></div>

<script>
const LINES = [{"t": "風吹裂了　昨夜未乾的誓言", "s": "主歌一"}, {"t": "琉璃碎在　掌心化成了深淵", "s": ""}, {"t": "我曾以為　緊握就能留住明天", "s": ""}, {"t": "直到殘燭　燃盡最後一縷煙", "s": ""}, {"t": "你看那漫天揚起的塵埃", "s": "導歌一"}, {"t": "遮蔽了原本信奉的崇拜", "s": ""}, {"t": "在崩塌的廢墟裡　聽骨骼重組的聲響", "s": ""}, {"t": "痛楚是蛻變唯一的方向", "s": ""}, {"t": "在幻滅裡看清　脆弱的軀殼", "s": "副歌一"}, {"t": "在沉淪中學會　踏平了坎坷", "s": ""}, {"t": "任烈火吞噬　所有的執著與沈默", "s": ""}, {"t": "我撕裂黑夜　喚醒心底的佛", "s": ""}, {"t": "自灰燼裡重生　綻放成金色金蓮", "s": ""}, {"t": "不再問因果　只走向遼闊", "s": ""}, {"t": "腳步踩過　冰封刺骨的荒原", "s": "主歌二"}, {"t": "每道傷口　凝結成新的冠冕", "s": ""}, {"t": "懂得放下　才能看懂世間萬變", "s": ""}, {"t": "告別昨天　告別曾跪求的圓滿", "s": ""}, {"t": "聽雷聲震落最後的悲哀", "s": "導歌二"}, {"t": "大地正迎來重生的洗牌", "s": ""}, {"t": "在無聲的深海裡　浮現出光芒的微亮", "s": ""}, {"t": "那是靈魂破繭時的滾燙", "s": ""}, {"t": "在幻滅裡看清　脆弱的軀殼", "s": "副歌二"}, {"t": "在沉淪中學會　踏平了坎坷", "s": ""}, {"t": "任烈火吞噬　所有的執著與沈默", "s": ""}, {"t": "我撕裂黑夜　喚醒心底的佛", "s": ""}, {"t": "自灰燼裡重生　綻放成金色金蓮", "s": ""}, {"t": "不再問因果　只走向遼闊", "s": ""}, {"t": "嗡　奔流的江河　熄滅了恐慌", "s": "橋段"}, {"t": "嗡　萬物的寂滅　是新的初陽", "s": ""}, {"t": "不退　不懼　不生　不滅", "s": ""}, {"t": "天地空明　一念即超脫", "s": ""}, {"t": "在幻滅裡看清　脆弱的軀殼", "s": "副歌三"}, {"t": "在沉淪中學會　踏平了坎坷", "s": ""}, {"t": "任烈火吞噬　所有的執著與沈默", "s": ""}, {"t": "我撕裂黑夜　喚醒心底的佛", "s": ""}, {"t": "自灰燼裡重生　綻放成金色金蓮", "s": ""}, {"t": "不再問因果　只走向遼闊", "s": ""}, {"t": "光照徹了深淵", "s": "尾奏"}, {"t": "金蓮開在人間", "s": ""}, {"t": "無我　無妄　無牽", "s": ""}];
const a = document.getElementById('a');
// 曲は repo に入れない（公開 repo のため）。同じフォルダに song.mp3 を置くか、
// 上の「選擇檔案」から手元の音源を読み込む。
a.src = 'song.mp3';
document.getElementById('pick').onchange = e => {
  const f = e.target.files[0];
  if (f) a.src = URL.createObjectURL(f);
};
const times = new Array(LINES.length).fill(null);
let ptr = 0;

const $ = id => document.getElementById(id);
const fmt = s => (s==null? '—' : (Math.floor(s/60)+':'+(s%60).toFixed(2).padStart(5,'0')));

function build(){
  const ul = $('list'); ul.innerHTML='';
  LINES.forEach((L,i)=>{
    if(L.s){ const d=document.createElement('li'); d.className='divider'; d.textContent=L.s; ul.appendChild(d); }
    const li=document.createElement('li'); li.id='li'+i;
    li.innerHTML = '<span class="n">'+(i+1)+'</span>'+
                   '<span class="t" data-i="'+i+'" role="button" tabindex="0">—</span>'+
                   '<span class="x">'+L.t+'</span>';
    ul.appendChild(li);
  });
  ul.querySelectorAll('.t').forEach(el=>{
    const go = ()=>{ const i=+el.dataset.i; ptr=i; if(times[i]!=null) a.currentTime=times[i]; paint(); };
    el.onclick = go;
    el.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } };
  });
}
function paint(){
  $('sec').textContent = LINES[ptr] ? (LINES[ptr].s || '') : '';
  $('cur').textContent = LINES[ptr] ? LINES[ptr].t : '全部完成 🪷';
  $('nxt').textContent = LINES[ptr+1] ? '下一句：'+LINES[ptr+1].t : '';
  $('cnt').textContent = times.filter(v=>v!=null).length;
  LINES.forEach((_,i)=>{
    const li=$('li'+i); if(!li) return;
    li.classList.toggle('cur', i===ptr);
    li.classList.toggle('set', times[i]!=null);
    li.querySelector('.t').textContent = fmt(times[i]);
  });
  const done = times.filter(v=>v!=null).length;
  $('out').value = done ? JSON.stringify(times.map(v=>v==null?null:+v.toFixed(2))) : '';
  $('tap').disabled = ptr >= LINES.length;
  const li=$('li'+ptr); if(li) li.scrollIntoView({block:'center',behavior:'smooth'});
}
function tap(){
  if(ptr>=LINES.length) return;
  times[ptr] = a.currentTime;
  ptr++;
  paint();
}
$('tap').onclick = tap;
$('back').onclick = ()=>{ ptr=Math.max(0,ptr-1); times[ptr]=null; paint(); };
$('rew').onclick = ()=>{ a.currentTime = Math.max(0, a.currentTime-5); };
$('play').onclick = ()=>{ a.paused ? a.play() : a.pause(); };
$('reset').onclick = ()=>{ times.fill(null); ptr=0; paint(); };
$('copy').onclick = async ()=>{
  const el=$('out'); el.removeAttribute('readonly'); el.select(); el.setSelectionRange(0,99999);
  try{ await navigator.clipboard.writeText(el.value); $('copy').textContent='已複製'; }
  catch(e){ document.execCommand('copy'); $('copy').textContent='已複製'; }
  el.setAttribute('readonly','');
  setTimeout(()=>{$('copy').textContent='複製結果';},1600);
};
a.addEventListener('timeupdate', ()=>{ $('clock').textContent = a.currentTime.toFixed(2); });
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='TEXTAREA') return;
  if(e.code==='Space'){ e.preventDefault(); tap(); }
  if(e.code==='Enter'){ e.preventDefault(); a.paused?a.play():a.pause(); }
});
build(); paint();
</script>
