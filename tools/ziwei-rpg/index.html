<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>紫微斗數 RPG 轉生系統</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #121212;
    color: #eee;
    padding: 24px;
  }
  h1 { text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #999; margin-bottom: 24px; font-size: 14px; }
  .container { max-width: 760px; margin: 0 auto; }
  fieldset {
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 16px;
  }
  legend { padding: 0 8px; font-weight: 600; color: #f59e0b; }
  .hint { color: #888; font-size: 12px; margin: 0 0 10px; }
  label.field-label { display: block; font-size: 12px; color: #999; margin: 8px 0 4px; }
  select, input[type=text] {
    font-family: inherit; font-size: 14px;
    background: #1e1e1e; color: #eee; border: 1px solid #333;
    border-radius: 6px; padding: 8px 12px; width: 100%;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 220px; }
  .check-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .check-row input { width: auto; }
  .check-row label { color: #ccc; font-size: 13px; }
  .star-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 8px; margin-top: 8px;
  }
  .star-item {
    display: flex; align-items: center; gap: 6px;
    background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 6px;
    padding: 6px 8px; font-size: 13px;
  }
  .star-item input { width: auto; flex-shrink: 0; }
  .tag {
    display: inline-block; font-size: 10px; font-weight: 700; border-radius: 4px;
    padding: 1px 5px; margin-left: auto; flex-shrink: 0;
  }
  .tag-C { background: #3a3a3a; color: #aaa; }
  .tag-R { background: #1e3a5f; color: #7fb8ff; }
  .tag-SR { background: #3b1e5f; color: #d19fff; }
  .tag-SSR {
    background: linear-gradient(135deg, #f59e0b, #ec4899, #a855f7);
    color: #111; box-shadow: 0 0 8px rgba(245,158,11,.6);
  }
  button {
    cursor: pointer; background: #d97706; color: #111; border: none; font-weight: 600;
    font-family: inherit; font-size: 15px; border-radius: 8px; padding: 12px 20px;
    width: 100%;
  }
  button:hover { background: #f59e0b; }
  button.secondary {
    background: #2a2a2a; color: #eee; width: auto; padding: 8px 16px; font-size: 13px;
  }
  button.secondary:hover { background: #3a3a3a; }
  #result { display: none; margin-top: 20px; }
  .card {
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px;
    padding: 20px; margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 4px; }
  .overall-badge {
    display: inline-block; font-weight: 700; font-size: 13px; border-radius: 6px;
    padding: 3px 10px; margin-left: 8px; vertical-align: middle;
  }
  .card-sub { color: #999; font-size: 13px; margin-bottom: 14px; }
  .stat-block { margin-bottom: 14px; }
  .stat-block h3 { margin: 0 0 6px; font-size: 15px; color: #f59e0b; }
  .stat-block p { margin: 0; color: #ddd; font-size: 14px; line-height: 1.6; }
  .skill-list { list-style: none; padding: 0; margin: 0; }
  .skill-list li {
    background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .skill-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .skill-name { font-weight: 600; font-size: 14px; }
  .skill-slot { font-size: 11px; color: #888; }
  .skill-desc { font-size: 13px; color: #bbb; line-height: 1.5; }
  .leftover-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .leftover-tags span {
    font-size: 12px; background: #1e1e1e; border: 1px solid #2a2a2a;
    border-radius: 6px; padding: 4px 8px;
  }
  #copyBtn { margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <h1>⭐ 紫微斗數 RPG 轉生系統</h1>
  <div class="subtitle">將命盤數據 100% 轉化為奇幻世界角色面板</div>

  <fieldset>
    <legend>基本命盤</legend>
    <label class="field-label">角色名稱（選填）</label>
    <input type="text" id="charName" placeholder="幫這位轉生者取個名字..." />

    <div class="row">
      <div>
        <label class="field-label">命宮主星</label>
        <select id="mingStar"></select>
        <div class="check-row">
          <input type="checkbox" id="soloSitting" />
          <label for="soloSitting">命宮主星獨坐（無其他主星同宮）</label>
        </div>
      </div>
      <div>
        <label class="field-label">身宮主星</label>
        <select id="shenStar"></select>
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend>R 級・輔星與吉曜</legend>
    <p class="hint">著名輔星吉曜（魁鉞、左輔右弼、文昌文曲、祿存）— 約占人群 35%</p>
    <div class="star-grid" id="rGrid"></div>
  </fieldset>

  <fieldset>
    <legend>C 級・雜曜與流年小星</legend>
    <p class="hint">乙級星、雜曜、流年小星 — 約占人群 40%</p>
    <div class="star-grid" id="cGrid"></div>
  </fieldset>

  <fieldset>
    <legend>SR 級・重要煞星與化星</legend>
    <p class="hint">單一化星（祿權科忌）、重要煞星（火鈴羊陀）— 約占人群 20%</p>
    <div class="star-grid" id="srGrid"></div>
  </fieldset>

  <fieldset>
    <legend>SSR 級・稀世格局判定</legend>
    <p class="hint">極端稀世格局，約占人群 5%。部分格局會由上方勾選自動判定，以下為需額外確認的格局：</p>
    <div class="check-row">
      <input type="checkbox" id="jiYangSame" />
      <label for="jiYangSame">上方勾選的「化忌」與「擎羊」實際同宮（觸發「忌羊絕殺」突變格局）</label>
    </div>
    <div class="check-row">
      <input type="checkbox" id="doubleJi" />
      <label for="doubleJi">雙化忌交會（本命化忌與大限/流年化忌同時衝會命宮，觸發「雙忌逆命」反格）</label>
    </div>
  </fieldset>

  <button id="genBtn">⚡ 開始轉生</button>

  <div id="result">
    <div class="card" id="identityCard"></div>
    <div class="card" id="bloodlineCard"></div>
    <div class="card" id="skillCard"></div>
    <div class="card" id="leftoverCard"></div>
    <button class="secondary" id="copyBtn">📋 複製角色卡文字</button>
  </div>
</div>

const SLOT_LABEL = { bloodline:"血統天賦", passive:"職業技能・被動", active:"職業技能・主動" };

// ---------- 建立下拉選單與星曜勾選格 ----------
const mingSel = document.getElementById("mingStar");
const shenSel = document.getElementById("shenStar");
MAIN_STAR_ORDER.forEach(id => {
  const star = MAIN_STARS[id];
  [mingSel, shenSel].forEach(sel => {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = star.name;
    sel.appendChild(opt);
  });
});

function buildStarGrid(containerId, rarity) {
  const grid = document.getElementById(containerId);
  AUX_STARS.filter(s => s.rarity === rarity).forEach(s => {
    const item = document.createElement("label");
    item.className = "star-item";
    item.innerHTML = `<input type="checkbox" id="aux_${s.id}" /> ${s.name} <span class="tag tag-${s.rarity}">${s.rarity}</span>`;
    grid.appendChild(item);
  });
}
buildStarGrid("rGrid", "R");
buildStarGrid("cGrid", "C");
buildStarGrid("srGrid", "SR");

// ---------- 轉生產生邏輯 ----------
function pickTop(pool, slot, n) {
  return pool.filter(x => x.slot === slot)
             .sort((a,b) => RARITY_WEIGHT[b.rarity] - RARITY_WEIGHT[a.rarity])
             .slice(0, n);
}

document.getElementById("genBtn").addEventListener("click", () => {
  const mingId = mingSel.value;
  const shenId = shenSel.value;
  const ming = MAIN_STARS[mingId];
  const shen = MAIN_STARS[shenId];
  const soloSitting = document.getElementById("soloSitting").checked;
  const jiYangSame = document.getElementById("jiYangSame").checked;
  const doubleJi = document.getElementById("doubleJi").checked;
  const name = document.getElementById("charName").value.trim() || "無名轉生者";

  // 收集已勾選的輔星/煞星/化星/雜曜
  let pool = AUX_STARS.filter(s => document.getElementById("aux_" + s.id).checked)
                       .map(s => ({...s}));

  const selectedIds = new Set(pool.map(s => s.id));

  // ---- SSR / SR 特殊格局判定 ----
  const ziweiSolo = mingId === "ziwei" && soloSitting;
  const sanQi = selectedIds.has("hualu") && selectedIds.has("huaquan") && selectedIds.has("huake");
  const jiYangMutation = selectedIds.has("huaji") && selectedIds.has("qingyang") && jiYangSame;

  if (ziweiSolo) {
    pool.push({ id:"ziweiSolo", name:"至尊孤帝", rarity:"SSR", slot:"bloodline",
      title:"至尊孤帝：天命所歸", desc:"紫微獨坐命宮，君臨天下的孤高帝格，一生自帶主角光環，凡人萬中無一。" });
  } else if (soloSitting) {
    pool.push({ id:"solo", name:"孤高血統", rarity:"SR", slot:"bloodline",
      title:"孤高血統：獨當一面", desc:"命宮僅有一顆主星獨坐，個性鮮明強烈，不容他人取代。" });
  }

  if (sanQi) {
    pool.push({ id:"sanqi", name:"三奇嘉會", rarity:"SSR", slot:"bloodline",
      title:"三奇嘉會：天選之子", desc:"化祿、化權、化科三奇齊會命宮，凡間罕見的天選命格，做事無往不利。" });
  }
  if (jiYangMutation) {
    pool.push({ id:"jiyang", name:"忌羊絕殺", rarity:"SSR", slot:"active",
      title:"忌羊絕殺：向死而生", desc:"化忌與擎羊同宮引動的極端突變格局，越是絕境爆發的力量越驚人。" });
  }
  if (doubleJi) {
    pool.push({ id:"doubleji", name:"雙忌逆命", rarity:"SSR", slot:"active",
      title:"雙忌逆命：破而後立", desc:"雙重化忌交會命盤，命運兩度將你推落深淵，卻也因此鍛造出逆天改命的意志。" });
  }

  // ---- 分配欄位 ----
  const bloodlinePicks = pool.filter(x => x.slot === "bloodline")
                              .sort((a,b) => RARITY_WEIGHT[b.rarity] - RARITY_WEIGHT[a.rarity]);
  const passivePicks = pickTop(pool, "passive", 2);
  const activePicks = pickTop(pool, "active", 2);

  const usedIds = new Set([...bloodlinePicks, ...passivePicks, ...activePicks].map(x => x.id));

  const FILLER_PASSIVE = { rarity:"C", title:"尚未覺醒", desc:"這個職業技能欄位尚未被命盤星曜點亮，靜待機緣覺醒。" };
  const FILLER_ACTIVE = { rarity:"C", title:"尚未覺醒", desc:"這個職業技能欄位尚未被命盤星曜點亮，靜待機緣覺醒。" };
  while (passivePicks.length < 2) passivePicks.push({...FILLER_PASSIVE});
  while (activePicks.length < 2) activePicks.push({...FILLER_ACTIVE});
  if (bloodlinePicks.length === 0) {
    bloodlinePicks.push({ rarity:"C", title:"平凡血統", desc:"命宮清淡，尚無特殊天賦顯現，一切潛能仍靜待挖掘。" });
  }

  const leftover = pool.filter(x => !usedIds.has(x.id));

  // ---- 整體稀有度 ----
  const allRealItems = [...bloodlinePicks, ...passivePicks, ...activePicks, ...leftover]
    .filter(x => x.title !== "尚未覺醒" && x.title !== "平凡血統");
  let overall = "C";
  allRealItems.forEach(x => { if (RARITY_WEIGHT[x.rarity] > RARITY_WEIGHT[overall]) overall = x.rarity; });

  renderResult({ name, ming, shen, soloSitting, ziweiSolo, overall, bloodlinePicks, passivePicks, activePicks, leftover });
});

function tagHtml(rarity) {
  return `<span class="tag tag-${rarity}" style="margin-left:8px;">${rarity}</span>`;
}

function renderResult({ name, ming, shen, ziweiSolo, overall, bloodlinePicks, passivePicks, activePicks, leftover }) {
  const identityCard = document.getElementById("identityCard");
  identityCard.innerHTML = `
    <h2>${name}${tagHtml(overall)}</h2>
    <div class="card-sub">命宮主星：${ming.name}　｜　身宮主星：${shen.name}</div>
    <div class="stat-block">
      <h3>🧬 轉生種族：${ming.race}${ziweiSolo ? "（覺醒態）" : ""}</h3>
      <p>${ming.appearance}</p>
    </div>
    <div class="stat-block">
      <h3>⚔️ 初始職業：${ming.cls}</h3>
      <p>${ming.classFlavor}</p>
    </div>
    <div class="stat-block">
      <h3>🌙 隱藏氣質（身宮・${shen.name}）</h3>
      <p>${shen.bodyFlavor}</p>
    </div>
  `;

  const bloodlineCard = document.getElementById("bloodlineCard");
  bloodlineCard.innerHTML = `<h3 style="margin-top:0;color:#f59e0b;">🩸 血統天賦</h3><ul class="skill-list">` +
    bloodlinePicks.map(x => `
      <li>
        <div class="skill-head">
          <span class="skill-name">${x.title}</span>
          <span class="tag tag-${x.rarity}">${x.rarity}</span>
        </div>
        <div class="skill-desc">${x.desc}</div>
      </li>`).join("") + `</ul>`;

  const skillCard = document.getElementById("skillCard");
  skillCard.innerHTML = `<h3 style="margin-top:0;color:#f59e0b;">✨ 職業技能</h3><ul class="skill-list">` +
    [...passivePicks.map(x => ({...x, slot:"被動"})), ...activePicks.map(x => ({...x, slot:"主動"}))]
      .map(x => `
      <li>
        <div class="skill-head">
          <span class="skill-name">${x.title}</span>
          <span class="skill-slot">（${x.slot}）</span>
          <span class="tag tag-${x.rarity}">${x.rarity}</span>
        </div>
        <div class="skill-desc">${x.desc}</div>
      </li>`).join("") + `</ul>`;

  const leftoverCard = document.getElementById("leftoverCard");
  if (leftover.length) {
    leftoverCard.innerHTML = `<h3 style="margin-top:0;color:#f59e0b;">💫 其他潛藏星曜氣息</h3><div class="leftover-tags">` +
      leftover.map(x => `<span>${x.name || x.title}${tagHtml(x.rarity)}</span>`).join("") + `</div>`;
    leftoverCard.style.display = "block";
  } else {
    leftoverCard.style.display = "none";
  }

  document.getElementById("result").style.display = "block";
  document.getElementById("result").scrollIntoView({ behavior: "smooth" });
}

document.getElementById("copyBtn").addEventListener("click", () => {
  const text = document.getElementById("result").innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copyBtn");
    const original = btn.textContent;
    btn.textContent = "✅ 已複製！";
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
});
</script>
</body>
</html>
